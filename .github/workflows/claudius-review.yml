---
# Dogfooding: reviews every non-draft PR in this repo using the action code
# from the PR itself (`uses: ./`), so each PR also tests its own changes.
name: Claudius Self-Review

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets on pull_request, so skip them instead of failing.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout PR (provides the action under test)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Review with this PR's version of the action
        uses: ./
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          memcan_url: ${{ secrets.MEMCAN_URL }}
          memcan_api_key: ${{ secrets.MEMCAN_API_KEY }}
          checkout: "false"
          remove_label_on_success: "false"
          transcripts_recipients: github:lklimek
