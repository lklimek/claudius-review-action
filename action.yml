---
name: "Claudius PR Review"
description: "Claudius AI-powered PR code review using Claude Code"
branding:
  icon: eye
  color: purple

inputs:
  anthropic_api_key:
    description: "Anthropic API key (alternative to OAuth)"
    required: false
    default: ""
  claude_code_oauth_token:
    description: "Claude Code OAuth token (alternative to API key)"
    required: false
    default: ""
  memcan_url:
    description: "MemCan server URL (e.g., http://host:8190)"
    required: false
    default: ""
  memcan_api_key:
    description: "MemCan API key for server authentication"
    required: false
    default: ""
  github_token:
    description: "GitHub token for API/CLI"
    required: false
    default: ${{ github.token }}
  allowed_non_write_users:
    description: "Comma-separated GitHub usernames (or '*') allowed to trigger the review without write/admin access to the repo — e.g. a triage-permission bot/service account that only applies the trigger label. Passed through to claude-code-action, which requires github_token to be set for this to take effect. WARNING: bypasses a real security gate; keep it scoped to specific trusted accounts, avoid '*' on public repos."
    required: false
    default: ""
  claude_agent:
    description: "Main-thread Claude agent. The default is the lightweight coordinator shipped with this action (claude/agents), whose model comes from the model input. A plugin agent such as claudius:claudius runs on its own frontmatter model instead."
    required: false
    default: "claudius-ci-reviewer"
  model:
    description: "Model for the main (coordinator) thread, e.g. sonnet or opus. Reviewer sub-agents always use the per-role models assigned by claudius:grumpy-review. Empty = inherit Claude Code's default (ANTHROPIC_MODEL)."
    required: false
    default: "sonnet"
  plugins:
    description: "Newline-separated plugin list"
    required: false
    default: |
      claudius@lklimek
      claudash@lklimek
      memcan@lklimek
  plugin_marketplaces:
    description: "Newline-separated marketplace URLs"
    required: false
    default: |
      https://github.com/lklimek/agents.git
  prompt_extra:
    description: "Additional instructions appended to core prompt"
    required: false
    default: ""
  trigger_label:
    description: "Label to remove on success"
    required: false
    default: "claudius-review"
  remove_label_on_success:
    description: "Whether to remove trigger label"
    required: false
    default: "true"
  reviewer_login:
    description: "GitHub login requested as reviewer to clear from pending review requests on success — set this when triggering via review_requested (see README's 'Triggering by Review Request'). The review itself is posted under whichever GitHub identity github_token authenticates as, not this account, so GitHub never auto-clears this account's own pending request; leave empty (default) to skip this step, e.g. when only using the label trigger."
    required: false
    default: ""
  remove_review_request_on_success:
    description: "Whether to clear reviewer_login's pending review request on success. No-op when reviewer_login is empty."
    required: false
    default: "true"
  debug_output:
    description: >-
      Show full raw Claude Code JSON output (tool calls/results) in the job
      log.

      WARNING: may leak secrets/tokens into publicly-visible Actions logs —
      enable only for troubleshooting.

      Also turned on automatically when GitHub's own 'Enable debug logging'
      re-run checkbox is checked (the runner.debug context is '1') — that
      checkbox alone otherwise triggers extra runner-level tracing but
      leaves this action just as quiet, and a re-run replays the original
      workflow snapshot so editing this input wouldn't reach an
      already-triggered re-run anyway.
    required: false
    default: "false"
  checkout:
    description: "Whether action handles git checkout"
    required: false
    default: "true"
  fetch_depth:
    description: "Git fetch depth (only if checkout=true)"
    required: false
    default: "0"
  allowed_tools:
    description: "Tool allowlist for Claude"
    required: false
    default: "Read,Write,Edit,Glob,Grep,Agent,Skill,Task,TaskCreate,TaskUpdate,TaskList,TaskGet,TaskOutput,SendMessage,Bash(gh pr *),Bash(gh api *),Bash(git diff *),Bash(git log *),Bash(git fetch *),Bash(git branch *),Bash(git rev-parse *),Bash(git show *),Bash(git pull *),Bash(git checkout *),Bash(git status),Bash(git status *),Bash(git remote *),Bash(git merge-base *),Bash(echo *),Bash(ls *),Bash(jq *),Bash(mkdir *),Bash(mktemp *),Bash(pwd *),Bash(*gh-resolve-review-threads.sh *),Bash(*gh-post-review-reply.sh *),Bash(*gh-fetch-review-comments.sh *),Bash(*gh-fetch-reviews.sh *),Bash(*gh-list-review-threads.sh *),Bash(*gh-request-reviewer.sh *),Bash(*gh-pr-base-sha.sh *),Bash(*consolidate_reports.py *),Bash(*validate_report.py *),Bash(*generate_review_report.py *),Bash(*merge_findings_helper.py *),Bash(*lint_ephemeral_ids.py *),mcp__plugin_memcan_brain,mcp__plugin_memcan_brain__search,mcp__plugin_memcan_brain__search_memories,mcp__plugin_memcan_brain__add_memory,mcp__plugin_memcan_brain__update_memory,mcp__plugin_memcan_brain__delete_memory,mcp__plugin_memcan_brain__count_memories"
  claude_extra_args:
    description: "Additional Claude Code CLI flags (appended to built-in args)"
    required: false
    default: ""
  report_retention_days:
    description: "Artifact retention days"
    required: false
    default: "14"
  upload_transcripts:
    description: >-
      Upload Claude Code session transcripts (coordinator + sub-agents) as a
      workflow artifact. WARNING: transcripts contain raw tool output; anyone
      who can download this run's artifacts can read them.
    required: false
    default: "true"
  transcript_retention_days:
    description: "Retention days for the transcripts artifact"
    required: false
    default: "7"

outputs:
  report_artifact_name:
    description: "Name of the uploaded review report artifact"
    value: claude-review-report-pr-${{ github.event.pull_request.number }}
  transcripts_artifact_name:
    description: "Name of the uploaded Claude Code transcripts artifact (when upload_transcripts is true)"
    value: claude-transcripts-pr-${{ github.event.pull_request.number }}

runs:
  using: composite
  steps:
    - name: Validate authentication
      shell: bash
      run: |
        if [ -z "${{ inputs.anthropic_api_key }}" ] && [ -z "${{ inputs.claude_code_oauth_token }}" ]; then
          echo "::error::Either 'anthropic_api_key' or 'claude_code_oauth_token' must be provided."
          exit 1
        fi

    - name: Verify triggering actor has write access
      shell: bash
      run: |
        ACTOR="${{ github.event.sender.login }}"
        if [ -z "$ACTOR" ]; then
          echo "::warning::Could not determine the triggering actor (github.event.sender.login was empty) — skipping the write-access preflight. The underlying claude-code-action will still enforce this itself."
          exit 0
        fi

        # Mirror claude-code-action's own allowed_non_write_users bypass so this
        # fast preflight agrees with what the underlying action will actually do
        # (it's passed through to that action below too). Without this, a
        # triage-permission bot allow-listed there would still get rejected here.
        #
        # Normalize (trim) once and export it via GITHUB_ENV so the exact same
        # string is what claude-code-action itself receives below — otherwise
        # the two steps could independently disagree on edge cases like a
        # trailing space in "* " and reintroduce the opaque ~40s failure this
        # preflight exists to avoid. Match is exact-case, not case-folded:
        # claude-code-action compares the raw actor string exactly (GitHub
        # logins are case-insensitive for lookup, but that's not what it does
        # here), so case-folding here would let this preflight pass while
        # upstream still rejects a differently-cased entry — worse than today,
        # since it would fail slow and opaque instead of fast and clear.
        ALLOWED_NON_WRITE="$(echo "${{ inputs.allowed_non_write_users }}" | xargs)"
        echo "ALLOWED_NON_WRITE_USERS=${ALLOWED_NON_WRITE}" >> "$GITHUB_ENV"

        if [ "$ALLOWED_NON_WRITE" = "*" ]; then
          echo "allowed_non_write_users='*' — skipping the write-access preflight for @${ACTOR}."
          exit 0
        fi
        IFS=',' read -ra ALLOWED_LIST <<< "$ALLOWED_NON_WRITE"
        for u in "${ALLOWED_LIST[@]}"; do
          u="$(echo "$u" | xargs)"
          if [ -n "$u" ] && [ "$u" = "$ACTOR" ]; then
            echo "Triggering actor @${ACTOR} is in allowed_non_write_users — skipping the write-access preflight."
            exit 0
          fi
        done

        PERM=$(gh api "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null || echo "unknown")
        echo "Triggering actor: $ACTOR (permission: $PERM)"
        case "$PERM" in
          admin|write) ;;
          *)
            echo "::error::@${ACTOR} triggered this review but does not have write access to this repository (permission: ${PERM}). claude-code-action requires admin or write access to run safely and rejects anything less — including 'maintain' or 'triage' — with an opaque error after ~40s of setup; failing fast instead. Ask someone with write access to (re-)apply the '${{ inputs.trigger_label }}' label, or add '${ACTOR}' to this action's allowed_non_write_users input if it's a trusted bot/service account (matching is exact-case, same as claude-code-action itself)."
            exit 1
            ;;
        esac
      env:
        GH_TOKEN: ${{ inputs.github_token }}

    - name: Pre-flight checks
      shell: bash
      run: |
        if [ -n "${{ inputs.memcan_url }}" ] && [ -n "${{ inputs.memcan_api_key }}" ]; then
          echo "MEMCAN_AVAILABLE=true" >> "$GITHUB_ENV"
        else
          echo "::warning::MemCan URL or API key not provided. MemCan features will be unavailable."
          echo "MEMCAN_AVAILABLE=false" >> "$GITHUB_ENV"
        fi
        echo "::group::Claude Code environment"
        echo "ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-<not set>}"
        echo "CLAUDE_CODE_MAX_TURNS=${CLAUDE_CODE_MAX_TURNS:-<not set>}"
        echo "CLAUDE_CODE_EFFORT_LEVEL=${CLAUDE_CODE_EFFORT_LEVEL:-<not set>}"
        echo "CLAUDE_CODE_SUBAGENT_MODEL=${CLAUDE_CODE_SUBAGENT_MODEL:-<not set>}"
        echo "CLAUDE_CODE_AUTO_COMPACT=${CLAUDE_CODE_AUTO_COMPACT:-<not set>}"
        echo "CLAUDE_CODE_COMPACT_THRESHOLD=${CLAUDE_CODE_COMPACT_THRESHOLD:-<not set>}"
        echo "CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING=${CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING:-<not set>}"
        echo "CLAUDE_CODE_DISABLE_1M_CONTEXT=${CLAUDE_CODE_DISABLE_1M_CONTEXT:-<not set>}"
        echo "::endgroup::"

    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch_depth }}

    - name: Configure git HTTPS
      shell: bash
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Install report-rendering dependencies
      shell: bash
      run: |
        # GH-hosted runners can still be running apt-daily/apt-daily-upgrade in
        # the background right after boot, holding the dpkg lock; apt then
        # blocks with zero output (not even under -qq) until the lock frees,
        # which has been observed to add 20-30+ minutes of silent stall to this
        # step. Stop those timers/services first so our apt-get calls run
        # immediately instead of queuing behind them.
        sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
        sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true

        # claudius's report scripts (consolidate_reports.py, validate_report.py,
        # generate_review_report.py) expect these as system packages — see the
        # claudius CLAUDE.md "Python deps come from apt" convention. Runner images
        # don't have them; installing here avoids a mid-review crash on `import markdown`
        # (or jsonschema/jinja2/etc.) inside the sandboxed Claude session.
        # matplotlib/reportlab are deliberately excluded: they're only imported
        # by generate_review_report.py's `--format pdf` path, and this action's
        # prompt always renders `--format html`. Restore them here if that ever
        # changes. --no-install-recommends skips their would-be Tk/X11/font
        # transitive closure that html/md/triage rendering never touches.
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          python3-markdown python3-jsonschema python3-yaml python3-jinja2 \
          python3-bs4 python3-markupsafe
        # python3-nh3 isn't resolvable via apt on every runner image (it entered
        # Ubuntu's archives later than some LTS releases still in use), and an
        # `apt-get install` failure on just this package would abort the whole
        # step — taking the review down with it. Try apt first to keep the
        # system-package convention where it's available; fall back to pip only
        # for this one package when apt can't provide it.
        if ! sudo apt-get install -y -qq --no-install-recommends python3-nh3; then
          echo "python3-nh3 not available via apt on this runner; falling back to pip"
          pip3 install --break-system-packages --quiet nh3
        fi

    - name: Create report directories
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/review-report" "${{ runner.temp }}/claudius-review"
        echo "REPORT_DIR=${{ github.workspace }}/review-report" >> "$GITHUB_ENV"
        echo "SCRATCH_DIR=${{ runner.temp }}/claudius-review" >> "$GITHUB_ENV"

    - name: Install review skill and coordinator agent
      shell: bash
      run: |
        # User-level (~/.claude) skills/agents are loaded by claude-code-action
        # (settingSources includes "user"), and stay out of the reviewed repo.
        mkdir -p "$HOME/.claude/skills" "$HOME/.claude/agents"
        cp -r "${GITHUB_ACTION_PATH}/claude/skills/." "$HOME/.claude/skills/"
        MODEL="${INPUT_MODEL:-inherit}"
        sed "s/__MODEL__/${MODEL}/" "${GITHUB_ACTION_PATH}/claude/agents/claudius-ci-reviewer.md" \
          > "$HOME/.claude/agents/claudius-ci-reviewer.md"
      env:
        INPUT_MODEL: ${{ inputs.model }}

    - name: Run Claude Code Review
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        use_sticky_comment: true
        # runner.debug is GitHub's own documented context ("1" when someone
        # checks "Enable debug logging" on a re-run, unset otherwise) — fold
        # it into debug_output so that checkbox actually gets you the full
        # Claude turn-by-turn output, without needing to edit this workflow.
        # Re-running an existing run replays its original workflow snapshot,
        # so editing debug_output afterwards wouldn't apply to a re-run
        # anyway — this is the only way that checkbox can reach it.
        show_full_output: ${{ inputs.debug_output == 'true' || runner.debug == '1' }}
        trigger_phrase: ""
        github_token: ${{ inputs.github_token }}
        # Use the value normalized (trimmed) by the preflight step above, not
        # the raw input — guarantees this step and the preflight always agree
        # on the exact same string. See that step's comments for why.
        allowed_non_write_users: ${{ env.ALLOWED_NON_WRITE_USERS }}
        plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
        plugins: ${{ inputs.plugins }}
        prompt: |
          Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
          Invoke Skill(skill="ci-pr-review") and follow it exactly.

          ${{ inputs.prompt_extra }}
        claude_args: >-
          --agent ${{ inputs.claude_agent }}
          ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
          --allowedTools "${{ inputs.allowed_tools }}"
          ${{ inputs.claude_extra_args }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        MEMCAN_URL: ${{ inputs.memcan_url }}
        MEMCAN_API_KEY: ${{ inputs.memcan_api_key }}

    - name: Upload review report
      id: upload-report
      if: '!cancelled()'
      uses: actions/upload-artifact@v7
      with:
        name: claude-review-report-pr-${{ github.event.pull_request.number }}
        path: |
          ${{ github.workspace }}/review-report/report.json
          ${{ github.workspace }}/review-report/report.html
        retention-days: ${{ inputs.report_retention_days }}
        if-no-files-found: ignore

    - name: Collect Claude Code transcripts
      if: ${{ !cancelled() && inputs.upload_transcripts == 'true' }}
      shell: bash
      run: |
        DEST="${{ runner.temp }}/claude-transcripts"
        mkdir -p "$DEST"
        # Coordinator + sub-agent session logs (JSONL).
        [ -d "$HOME/.claude/projects" ] && cp -r "$HOME/.claude/projects" "$DEST/"
        [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ] && cp "$EXECUTION_FILE" "$DEST/"
        true
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}

    - name: Upload Claude Code transcripts
      if: ${{ !cancelled() && inputs.upload_transcripts == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: claude-transcripts-pr-${{ github.event.pull_request.number }}
        path: ${{ runner.temp }}/claude-transcripts
        retention-days: ${{ inputs.transcript_retention_days }}
        include-hidden-files: true
        overwrite: true
        if-no-files-found: ignore

    - name: Verify review report was produced
      if: '!cancelled()'
      shell: bash
      run: |
        if [ ! -f "${{ github.workspace }}/review-report/report.json" ]; then
          echo "::error::review-report/report.json is missing. The review agent ended its turn" \
            "without producing a report — most likely it spawned specialist agents in the" \
            "background and abandoned them (this run is single-shot; nothing resumes it). No" \
            "findings were posted. Failing the job instead of silently succeeding; the" \
            "'${{ inputs.trigger_label }}' label stays on the PR so this can be retried."
          exit 1
        fi

    - name: Append report link to last Claude review
      if: steps.upload-report.outputs.artifact-url != ''
      shell: bash
      run: |
        PR_NUMBER="${{ github.event.pull_request.number }}"
        ARTIFACT_URL="${{ steps.upload-report.outputs.artifact-url }}"
        REPORT_LINE="📊 **[View full HTML review report](${ARTIFACT_URL})**"
        # Find the last review posted by the review bot (claude[bot] when using
        # the Claude GitHub App token, github-actions[bot] with GITHUB_TOKEN).
        REVIEW_ID=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
          --jq '.[] | select(.user.login == "claude[bot]" or .user.login == "github-actions[bot]") | .id' | tail -n1)
        BODY=""
        if [ -n "$REVIEW_ID" ]; then
          BODY=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}" --jq '.body // empty')
        fi
        if [ -n "$REVIEW_ID" ] && [ -n "$BODY" ]; then
          CLEAN_BODY=$(echo "$BODY" | sed '/^📊 \*\*\[View full HTML review report\]/d')
          UPDATED="${CLEAN_BODY}
        ${REPORT_LINE}"
          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}" \
            -X PUT -f body="$UPDATED"
        else
          # Fallback: post as a regular comment if no Claude review found, or if the
          # found review has an empty body — GitHub's review-update API rejects PUTs
          # against a review whose original body is empty/missing (422 "Could not
          # edit a review with a missing body"), which happens whenever a review was
          # submitted with only inline comments and no summary text.
          gh pr comment "$PR_NUMBER" --body "$REPORT_LINE"
        fi
      env:
        GH_TOKEN: ${{ inputs.github_token }}

    - name: Remove trigger label
      if: inputs.remove_label_on_success == 'true' && success()
      shell: bash
      run: |
        gh pr edit "${{ github.event.pull_request.number }}" \
          --remove-label "${{ inputs.trigger_label }}" \
          || echo "::warning::Failed to remove the '${{ inputs.trigger_label }}' label. It will stay on the PR, which will re-trigger a full review on the next push — check that the token has label-write access."
      env:
        GH_TOKEN: ${{ inputs.github_token }}

    - name: Remove pending review request
      if: inputs.remove_review_request_on_success == 'true' && inputs.reviewer_login != '' && success()
      shell: bash
      run: |
        # The review itself was just posted under whichever GitHub identity
        # github_token authenticates as, not inputs.reviewer_login, so
        # GitHub never auto-clears reviewer_login's own pending review
        # request when that review lands.
        # Left alone, requested_reviewers keeps containing reviewer_login
        # forever, and a 'synchronize'-gated if-condition checking for it
        # would re-trigger a full review on every subsequent push.
        gh api --method DELETE \
          "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" \
          -f "reviewers[]=${{ inputs.reviewer_login }}" \
          || echo "::warning::Failed to remove the pending review request for '${{ inputs.reviewer_login }}'. It will stay on the PR, which will re-trigger a full review on the next push — check that the token has pull-requests write access."
      env:
        GH_TOKEN: ${{ inputs.github_token }}
