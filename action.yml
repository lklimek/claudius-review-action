---
name: "Claudius PR Review"
description: "Claudius AI-powered PR code review using Claude Code"
branding:
  icon: eye
  color: purple

inputs:
  anthropic_api_key:
    description: "Anthropic API key (alternative to OAuth)"
    required: false
    default: ""
  claude_code_oauth_token:
    description: "Claude Code OAuth token (alternative to API key)"
    required: false
    default: ""
  memcan_url:
    description: "MemCan server URL (e.g., http://host:8190)"
    required: false
    default: ""
  memcan_api_key:
    description: "MemCan API key for server authentication"
    required: false
    default: ""
  github_token:
    description: "GitHub token for API/CLI"
    required: false
    default: ${{ github.token }}
  claude_agent:
    description: "Claude agent persona"
    required: false
    default: "claudius:claudius"
  plugins:
    description: "Newline-separated plugin list"
    required: false
    default: |
      claudius@lklimek
      claudash@lklimek
      memcan@lklimek
  plugin_marketplaces:
    description: "Newline-separated marketplace URLs"
    required: false
    default: |
      https://github.com/lklimek/agents.git
  prompt_extra:
    description: "Additional instructions appended to core prompt"
    required: false
    default: ""
  trigger_label:
    description: "Label to remove on success"
    required: false
    default: "claudius-review"
  remove_label_on_success:
    description: "Whether to remove trigger label"
    required: false
    default: "true"
  debug_output:
    description: "Show full raw Claude Code JSON output (tool calls/results) in the job log. WARNING: may leak secrets/tokens into publicly-visible Actions logs — enable only for troubleshooting. Independent of GitHub's own 'Enable debug logging' re-run checkbox, which has no effect on this action's verbosity."
    required: false
    default: "false"
  checkout:
    description: "Whether action handles git checkout"
    required: false
    default: "true"
  fetch_depth:
    description: "Git fetch depth (only if checkout=true)"
    required: false
    default: "0"
  allowed_tools:
    description: "Tool allowlist for Claude"
    required: false
    default: "mcp__plugin_claudius_github,mcp__plugin_claudius_github__pull_request_read,mcp__plugin_claudius_github__pull_request_review_write,mcp__plugin_claudius_github__add_reply_to_pull_request_comment,Read,Write,Edit,Glob,Grep,Agent,Skill,Task,TaskCreate,TaskUpdate,TaskList,TaskGet,TaskOutput,SendMessage,Bash(gh pr *),Bash(gh api *),Bash(git diff *),Bash(git log *),Bash(git fetch *),Bash(git branch *),Bash(git rev-parse *),Bash(git show *),Bash(git pull *),Bash(git checkout *),Bash(git status),Bash(git status *),Bash(git remote *),Bash(git merge-base *),Bash(echo *),Bash(ls *),Bash(jq *),Bash(mkdir *),Bash(mktemp *),Bash(pwd *),Bash(*gh-resolve-review-threads.sh *),Bash(*gh-fetch-review-comments.sh *),Bash(*gh-fetch-reviews.sh *),Bash(*gh-list-review-threads.sh *),Bash(*gh-request-reviewer.sh *),Bash(*gh-post-review.sh *),Bash(*gh-pr-base-sha.sh *),Bash(*consolidate_reports.py *),Bash(*validate_report.py *),Bash(*generate_review_report.py *),mcp__plugin_memcan_brain,mcp__plugin_memcan_brain__search,mcp__plugin_memcan_brain__search_memories,mcp__plugin_memcan_brain__add_memory,mcp__plugin_memcan_brain__update_memory,mcp__plugin_memcan_brain__delete_memory,mcp__plugin_memcan_brain__count_memories"
  claude_extra_args:
    description: "Additional Claude Code CLI flags (appended to built-in args)"
    required: false
    default: ""
  report_retention_days:
    description: "Artifact retention days"
    required: false
    default: "14"

outputs:
  report_artifact_name:
    description: "Name of the uploaded review report artifact"
    value: claude-review-report-pr-${{ github.event.pull_request.number }}

runs:
  using: composite
  steps:
    - name: Validate authentication
      shell: bash
      run: |
        if [ -z "${{ inputs.anthropic_api_key }}" ] && [ -z "${{ inputs.claude_code_oauth_token }}" ]; then
          echo "::error::Either 'anthropic_api_key' or 'claude_code_oauth_token' must be provided."
          exit 1
        fi

    - name: Verify triggering actor has write access
      shell: bash
      run: |
        ACTOR="${{ github.event.sender.login }}"
        if [ -z "$ACTOR" ]; then
          echo "::warning::Could not determine the triggering actor (github.event.sender.login was empty) — skipping the write-access preflight. The underlying claude-code-action will still enforce this itself."
          exit 0
        fi
        PERM=$(gh api "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null || echo "unknown")
        echo "Triggering actor: $ACTOR (permission: $PERM)"
        case "$PERM" in
          admin|write|maintain) ;;
          *)
            echo "::error::@${ACTOR} triggered this review but does not have write access to this repository (permission: ${PERM}). claude-code-action requires write access to run safely and will reject this with an opaque error after ~40s of setup — failing fast instead. Ask someone with write access to (re-)apply the '${{ inputs.trigger_label }}' label."
            exit 1
            ;;
        esac
      env:
        GH_TOKEN: ${{ inputs.github_token }}

    - name: Pre-flight checks
      shell: bash
      run: |
        if [ -n "${{ inputs.memcan_url }}" ] && [ -n "${{ inputs.memcan_api_key }}" ]; then
          {
            echo 'MEMCAN_PROMPT<<MEMCAN_EOF'
            echo 'MemCan persistent memory is available. Use memcan:recall at session start to load project context.'
            echo 'Use memcan:lessons-learned only if the review found MEDIUM or higher severity findings worth remembering.'
            echo 'When spawning agents, pass MemCan context from recall results in their prompts.'
            echo 'MEMCAN_EOF'
          } >> "$GITHUB_ENV"
        else
          echo "::warning::MemCan URL or API key not provided. MemCan features will be unavailable."
          {
            echo 'MEMCAN_PROMPT<<MEMCAN_EOF'
            echo 'MemCan is NOT available — skip memcan:recall, memcan:lessons-learned, and all mcp__plugin_memcan_brain__* tools.'
            echo 'When spawning agents, instruct them to not use memcan tools.'
            echo 'MEMCAN_EOF'
          } >> "$GITHUB_ENV"
        fi
        echo "::group::Claude Code environment"
        echo "ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-<not set>}"
        echo "CLAUDE_CODE_MAX_TURNS=${CLAUDE_CODE_MAX_TURNS:-<not set>}"
        echo "CLAUDE_CODE_EFFORT_LEVEL=${CLAUDE_CODE_EFFORT_LEVEL:-<not set>}"
        echo "CLAUDE_CODE_SUBAGENT_MODEL=${CLAUDE_CODE_SUBAGENT_MODEL:-<not set>}"
        echo "CLAUDE_CODE_AUTO_COMPACT=${CLAUDE_CODE_AUTO_COMPACT:-<not set>}"
        echo "CLAUDE_CODE_COMPACT_THRESHOLD=${CLAUDE_CODE_COMPACT_THRESHOLD:-<not set>}"
        echo "CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING=${CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING:-<not set>}"
        echo "CLAUDE_CODE_DISABLE_1M_CONTEXT=${CLAUDE_CODE_DISABLE_1M_CONTEXT:-<not set>}"
        echo "::endgroup::"

    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@v6
      with:
        fetch-depth: ${{ inputs.fetch_depth }}

    - name: Configure git HTTPS
      shell: bash
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Install report-rendering dependencies
      shell: bash
      run: |
        # GH-hosted runners can still be running apt-daily/apt-daily-upgrade in
        # the background right after boot, holding the dpkg lock; apt then
        # blocks with zero output (not even under -qq) until the lock frees,
        # which has been observed to add 20-30+ minutes of silent stall to this
        # step. Stop those timers/services first so our apt-get calls run
        # immediately instead of queuing behind them.
        sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
        sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true

        # claudius's report scripts (consolidate_reports.py, validate_report.py,
        # generate_review_report.py) expect these as system packages — see the
        # claudius CLAUDE.md "Python deps come from apt" convention. Runner images
        # don't have them; installing here avoids a mid-review crash on `import markdown`
        # (or jsonschema/jinja2/etc.) inside the sandboxed Claude session.
        # matplotlib/reportlab are deliberately excluded: they're only imported
        # by generate_review_report.py's `--format pdf` path, and this action's
        # prompt always renders `--format html`. Restore them here if that ever
        # changes. --no-install-recommends skips their would-be Tk/X11/font
        # transitive closure that html/md/triage rendering never touches.
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          python3-markdown python3-jsonschema python3-yaml python3-jinja2 \
          python3-bs4 python3-markupsafe
        # python3-nh3 isn't resolvable via apt on every runner image (it entered
        # Ubuntu's archives later than some LTS releases still in use), and an
        # `apt-get install` failure on just this package would abort the whole
        # step — taking the review down with it. Try apt first to keep the
        # system-package convention where it's available; fall back to pip only
        # for this one package when apt can't provide it.
        if ! sudo apt-get install -y -qq --no-install-recommends python3-nh3; then
          echo "python3-nh3 not available via apt on this runner; falling back to pip"
          pip3 install --break-system-packages --quiet nh3
        fi

    - name: Create report directory
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/review-report"
        echo "REPORT_DIR=${{ github.workspace }}/review-report" >> "$GITHUB_ENV"

    - name: Run Claude Code Review
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        use_sticky_comment: true
        show_full_output: ${{ inputs.debug_output }}
        trigger_phrase: ""
        plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
        plugins: ${{ inputs.plugins }}
        prompt: |
          You are reviewing PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
          Base branch: ${{ github.event.pull_request.base.ref }}
          Head branch: ${{ github.event.pull_request.head.ref }}
          PR title: ${{ github.event.pull_request.title }}

          ${{ env.MEMCAN_PROMPT }}

          Use MCP tools (mcp__plugin_claudius_github__*) for GitHub operations. If an MCP call fails, fall back to gh CLI.

          Sub-agents have no conversation history —
          pass all relevant PR context explicitly when spawning them.

          This is a single-shot headless run: once your turn ends this process exits and nothing
          resumes you later — there is no later turn for a completion notification to reach you.
          You may still spawn agents in the background for concurrency, but you are the foreground
          monitor for them: after dispatching, call TaskOutput(task_id=..., block=true) for every
          agent you spawned and wait for its actual result before proceeding. Never end your turn
          (e.g. with a "sit tight, I'll report back once the crew returns" message) while any
          dispatched agent has not yet been collected — an uncollected agent is abandoned
          permanently, and any step that depended on it (consolidation, report writing, posting
          comments) will silently never happen. Do not end your turn until report.json has
          actually been written and findings have been posted.

          TaskOutput can time out and return before an agent is actually done (you'll see
          something like status:running in its result instead of a final answer) — that is NOT
          completion. On a timeout, call TaskOutput again for the same task_id and keep re-blocking
          until you get the agent's real result. Never treat a timed-out TaskOutput call as
          "collected" and move on. This rule applies transitively: any specialist agent you spawn
          (e.g. via claudius:grumpy-review) that itself spawns further sub-agents is bound by the
          same rule — tell it so explicitly in its own spawn prompt, since it has no way to know
          it's running headless otherwise.

          Do NOT create temporary directories (mktemp). Use REPORT_DIR env var for report output.

          Write all PR comments in Claudius persona — witty, confident, subtly snarky,
          but always respectful and genuinely helpful, as if advising a trusted colleague.

          If MemCan is available, invoke Skill(skill="memcan:recall") to load project context.

          Follow this review flow in order. Steps 1 and 2 MUST use the Skill tool —
          do NOT skip them or perform their work manually.

          1. Invoke Skill(skill="claudius:check-pr-comments") to check previous review comments.
             For each thread that IS fixed but NOT yet resolved, reply describing the fix
             and resolve the thread.
          2. Invoke Skill(skill="claudius:grumpy-review") to perform a fresh code review.
             This spawns parallel specialist agents and produces a consolidated report.
             Do NOT review the code yourself — the skill handles the full pipeline.
             Generate HTML format instead of markdown (use --format html in the render step).
             REPORT_DIR is pre-set to ${{ github.workspace }}/review-report — write report.json and report.html there. Do NOT create temp directories for reports.

             This job runs in an ephemeral sandbox with no warm Rust build cache, so any
             `cargo test`/`cargo build` here always pays a full cold compile — unlike a
             persistent dev machine. Tell claudius:grumpy-review explicitly (and it must relay
             this to qa-engineer-marvin) to skip full `cargo test`/`cargo build` execution as
             verification in this environment: this repository's own CI pipeline already runs
             the full test suite on this PR as the verification backstop. Prefer static
             verification instead — reading code, `cargo check`/`clippy` only if fast, git
             history, grep. An agent that can't verify a claim without compiling should report
             it as unverified rather than paying the cold-compile cost.
          3. Post only MEDIUM severity and higher findings as new inline PR comments.
          4. If no unresolved comments remain after the full flow, approve the PR.

          ${{ inputs.prompt_extra }}
        claude_args: >-
          --agent ${{ inputs.claude_agent }}
          --allowedTools "${{ inputs.allowed_tools }}"
          ${{ inputs.claude_extra_args }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MEMCAN_URL: ${{ inputs.memcan_url }}
        MEMCAN_API_KEY: ${{ inputs.memcan_api_key }}

    - name: Upload review report
      id: upload-report
      if: '!cancelled()'
      uses: actions/upload-artifact@v4
      with:
        name: claude-review-report-pr-${{ github.event.pull_request.number }}
        path: |
          ${{ github.workspace }}/review-report/report.json
          ${{ github.workspace }}/review-report/report.html
        retention-days: ${{ inputs.report_retention_days }}
        if-no-files-found: ignore

    - name: Verify review report was produced
      if: '!cancelled()'
      shell: bash
      run: |
        if [ ! -f "${{ github.workspace }}/review-report/report.json" ]; then
          echo "::error::review-report/report.json is missing. The review agent ended its turn" \
            "without producing a report — most likely it spawned specialist agents in the" \
            "background and abandoned them (this run is single-shot; nothing resumes it). No" \
            "findings were posted. Failing the job instead of silently succeeding; the" \
            "'${{ inputs.trigger_label }}' label stays on the PR so this can be retried."
          exit 1
        fi

    - name: Append report link to last Claude review
      if: steps.upload-report.outputs.artifact-url != ''
      shell: bash
      run: |
        PR_NUMBER="${{ github.event.pull_request.number }}"
        ARTIFACT_URL="${{ steps.upload-report.outputs.artifact-url }}"
        REPORT_LINE="📊 **[View full HTML review report](${ARTIFACT_URL})**"
        # Find the last review by claude[bot]
        REVIEW_ID=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
          --jq '[.[] | select(.user.login == "claude[bot]")] | last | .id // empty')
        if [ -n "$REVIEW_ID" ]; then
          BODY=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}" --jq '.body')
          # Remove any previous report link to avoid duplicates
          CLEAN_BODY=$(echo "$BODY" | sed '/^📊 \*\*\[View full HTML review report\]/d')
          UPDATED="${CLEAN_BODY}
        ${REPORT_LINE}"
          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}" \
            -X PUT -f body="$UPDATED"
        else
          # Fallback: post as a regular comment if no Claude review found
          gh pr comment "$PR_NUMBER" --body "$REPORT_LINE"
        fi
      env:
        GH_TOKEN: ${{ inputs.github_token }}

    - name: Remove trigger label
      if: inputs.remove_label_on_success == 'true' && success()
      shell: bash
      run: |
        gh pr edit "${{ github.event.pull_request.number }}" \
          --remove-label "${{ inputs.trigger_label }}" \
          || echo "::warning::Failed to remove the '${{ inputs.trigger_label }}' label. It will stay on the PR, which will re-trigger a full review on the next push — check that the token has label-write access."
      env:
        GH_TOKEN: ${{ inputs.github_token }}
